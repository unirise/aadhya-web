services:
  aadhya-web:
    image: ghcr.io/unirise-research-foundation/aadhya-web:latest
    restart: unless-stopped
    expose:
      - '80'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_network'
      - 'traefik.http.routers.aadhya-web-prod.entrypoints=websecure'
      - 'traefik.http.routers.aadhya-web-prod.rule=Host(`urf.buildstack.space`)'
      - 'traefik.http.routers.aadhya-web-prod.tls=true'
      - 'traefik.http.routers.aadhya-web-prod.tls.certresolver=lets-encrypt'
      - 'traefik.http.services.aadhya-web-prod.loadbalancer.server.port=80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - traefik_network

networks:
  traefik_network:
    external: true
