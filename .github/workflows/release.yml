name: Release - Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - develop

env:
  NODE_VERSION: 20
  REGISTRY: ghcr.io
  IMAGE_NAME: unirise-research-foundation/aadhya-web
  VITE_API_BASE_URL: https://api.urf.buildstack.space/api/v1
  VITE_API_URL: https://api.urf.buildstack.space/api/v1
  VPS_DOCKER_CONTEXT: vps
  COMPOSE_PROJECT_NAME: aadhya-web-prod

permissions:
  pull-requests: write
  contents: write
  actions: read
  deployments: write
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_API_URL=${{ env.VITE_API_URL }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 10
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY_CONTENT="$SSH_PRIVATE_KEY"
          printf '%s' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/id_key_raw

          if grep -q '\\n' ~/.ssh/id_key_raw; then
            printf '%b' "$(cat ~/.ssh/id_key_raw)" > ~/.ssh/id_key_try
          else
            cp ~/.ssh/id_key_raw ~/.ssh/id_key_try
          fi

          if ! grep -Eq 'BEGIN (OPENSSH|RSA|EC|DSA|ED25519) PRIVATE KEY' ~/.ssh/id_key_try; then
            base64 -d ~/.ssh/id_key_raw > ~/.ssh/id_key_try 2>/dev/null || true
          fi

          mv ~/.ssh/id_key_try ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          rm -f ~/.ssh/id_key_raw

          if ! ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1; then
            echo "Invalid SSH private key in KEY secret."
            exit 1
          fi

          if [ -z "${SSH_PORT:-}" ]; then SSH_PORT=22; fi
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.HOST }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Configure Docker SSH context
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "${SSH_PORT:-}" ]; then SSH_PORT=22; fi
          docker context rm "${{ env.VPS_DOCKER_CONTEXT }}" || true
          docker context create "${{ env.VPS_DOCKER_CONTEXT }}" --docker "host=ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:$SSH_PORT"

      - name: Pull and deploy on VPS
        run: |
          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" compose \
            --project-name "${{ env.COMPOSE_PROJECT_NAME }}" \
            -f docker/prod/docker-compose.yml \
            pull

          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" compose \
            --project-name "${{ env.COMPOSE_PROJECT_NAME }}" \
            -f docker/prod/docker-compose.yml \
            up -d --remove-orphans

      - name: Show deployed services
        run: |
          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" compose \
            --project-name "${{ env.COMPOSE_PROJECT_NAME }}" \
            -f docker/prod/docker-compose.yml \
            ps

      - name: Prune stale images
        run: |
          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" image prune -f --filter "until=168h" || true

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref_name == 'release'
    timeout-minutes: 5
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Generate date-based tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG="v$(date -u +'%Y.%m.%d')"
          EXISTING=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/${DATE_TAG}" --jq 'length')
          if [ "$EXISTING" -eq 0 ]; then
            TAG="$DATE_TAG"
          else
            TAG="${DATE_TAG}.$((EXISTING + 1))"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get merged PR description
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // empty')
          if [ -n "$PR_JSON" ]; then
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
            PR_BODY=$(echo "$PR_JSON" | jq -r '.body // empty')
            PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty')
          fi

          echo "pr_title=${PR_TITLE:-Release ${{ steps.tag.outputs.tag }}}" >> "$GITHUB_OUTPUT"

          NOTES_FILE=$(mktemp)
          if [ -n "$PR_BODY" ]; then
            echo "$PR_BODY" > "$NOTES_FILE"
          else
            echo "Release ${{ steps.tag.outputs.tag }}" > "$NOTES_FILE"
          fi
          if [ -n "$PR_NUMBER" ]; then
            echo "" >> "$NOTES_FILE"
            echo "---" >> "$NOTES_FILE"
            echo "Merged via PR #${PR_NUMBER}" >> "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.pr.outputs.pr_title }}" \
            --notes-file "${{ steps.pr.outputs.notes_file }}" \
            --target release
