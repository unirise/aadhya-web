name: Release - Build & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - release
      - feat/docker-setup

env:
  NODE_VERSION: 20
  VITE_API_BASE_URL: http://localhost:3001/api/v1
  VITE_API_URL: http://localhost:3001/api/v1
  VPS_DOCKER_CONTEXT: vps
  COMPOSE_PROJECT_NAME: ${{ github.ref_name == 'release' && 'aadhya-web-prod' || 'aadhya-web-smoke' }}

permissions:
  pull-requests: write
  contents: write
  actions: read
  deployments: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build app
        run: pnpm build

      - name: Validate production compose config
        run: docker compose -f docker/prod/docker-compose.yml config

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          KEY_CONTENT='${{ secrets.KEY }}'
          if printf '%s' "$KEY_CONTENT" | grep -q '\\n'; then
            printf '%b' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/id_rsa
          else
            printf '%s' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa

          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.HOST }}" > ~/.ssh/known_hosts

      - name: Verify SSH access to VPS
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          ssh -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${{ secrets.USERNAME }}@${{ secrets.HOST }}" "docker --version && docker compose version"

      - name: Configure Docker SSH context
        run: |
          SSH_PORT="${{ secrets.SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT=22; fi
          docker context rm "${{ env.VPS_DOCKER_CONTEXT }}" || true
          docker context create "${{ env.VPS_DOCKER_CONTEXT }}" --docker "host=ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:$SSH_PORT"
          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" info

      - name: Build and deploy on VPS
        run: |
          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" compose \
            --project-name "${{ env.COMPOSE_PROJECT_NAME }}" \
            -f docker/prod/docker-compose.yml \
            up -d --build --remove-orphans

      - name: Show deployed services
        run: |
          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" compose \
            --project-name "${{ env.COMPOSE_PROJECT_NAME }}" \
            -f docker/prod/docker-compose.yml \
            ps

      - name: Prune stale images
        run: |
          docker --context "${{ env.VPS_DOCKER_CONTEXT }}" image prune -f --filter "until=168h" || true

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref_name == 'release'
    timeout-minutes: 5
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Generate date-based tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_TAG="v$(date -u +'%Y.%m.%d')"
          EXISTING=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/${DATE_TAG}" --jq 'length')
          if [ "$EXISTING" -eq 0 ]; then
            TAG="$DATE_TAG"
          else
            TAG="${DATE_TAG}.$((EXISTING + 1))"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get merged PR description
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // empty')
          if [ -n "$PR_JSON" ]; then
            PR_TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
            PR_BODY=$(echo "$PR_JSON" | jq -r '.body // empty')
            PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number // empty')
          fi

          echo "pr_title=${PR_TITLE:-Release ${{ steps.tag.outputs.tag }}}" >> "$GITHUB_OUTPUT"

          NOTES_FILE=$(mktemp)
          if [ -n "$PR_BODY" ]; then
            echo "$PR_BODY" > "$NOTES_FILE"
          else
            echo "Release ${{ steps.tag.outputs.tag }}" > "$NOTES_FILE"
          fi
          if [ -n "$PR_NUMBER" ]; then
            echo "" >> "$NOTES_FILE"
            echo "---" >> "$NOTES_FILE"
            echo "Merged via PR #${PR_NUMBER}" >> "$NOTES_FILE"
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.pr.outputs.pr_title }}" \
            --notes-file "${{ steps.pr.outputs.notes_file }}" \
            --target release
